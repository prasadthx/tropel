[package]
name = "tropel-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = """
Stable public API for Tropel extension authors. Re-exports the types and
traits needed to implement input adapters, protocols, and outputs without
depending on internal crate details.
"""

# ── Semver policy ──────────────────────────────────────────────────
# tropel-sdk follows semver strictly. Any breaking change to re-exported
# types or traits requires a major version bump. Internal refactors in
# the backing crates (tropel-core, tropel-ext) that don't change the
# SDK surface are patch-level.
#
# Until 1.0.0, breaking changes bump the minor version (0.x → 0.y).

# ── Features ──────────────────────────────────────────────────────
# Protocol and Output are gated behind feature flags so a consumer that
# only writes input adapters never pays for (or is confused by) the
# extension traits. They ARE wired into engine dispatch (Protocol via
# the URL-scheme registry, Output from the sample stream); the flag just
# controls whether the SDK re-exports them. Breaking changes to these
# traits only require a minor version bump (pre-1.0) or a patch (post-1.0).
[features]
default = []
unstable-protocol = []
unstable-output = []

[dependencies]
tropel-core.workspace = true
tropel-ext.workspace = true
inventory.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Used to validate `wit/adapter.wit` resolves (keeps the WIT contract honest).
# NOTE: wasmtime 47's component toolchain actually pins wit-parser 0.252;
# this 0.207 is from the local cache and only validates syntax, which is
# stable across versions for the constructs used here.
wit-parser.workspace = true
