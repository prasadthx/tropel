[package]
name = "tropel-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = """
Stable public API for Tropel extension authors. Re-exports the types and
traits needed to implement input adapters, protocols, and outputs without
depending on internal crate details.
"""

# ── Semver policy ──────────────────────────────────────────────────
# tropel-sdk follows semver strictly. Any breaking change to re-exported
# types or traits requires a major version bump. Internal refactors in
# the backing crates (tropel-core, tropel-ext) that don't change the
# SDK surface are patch-level.
#
# Until 1.0.0, breaking changes bump the minor version (0.x → 0.y).

# ── Features ──────────────────────────────────────────────────────
# Unstable traits (Protocol, Output, AuthSigner) are gated behind
# feature flags. They exist in the backing crate but aren't yet wired
# into the engine dispatch. Gating them means the stable surface only
# shows what actually works. Breaking changes to unstable traits only
# require a minor version bump (pre-1.0) or a patch (post-1.0).
[features]
default = []
unstable-protocol = []
unstable-output = []
unstable-auth = []

[dependencies]
tropel-core.workspace = true
tropel-ext.workspace = true
inventory.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
