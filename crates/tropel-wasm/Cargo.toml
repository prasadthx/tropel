[package]
name = "tropel-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM plugin runtime for Tropel — loads and runs WebAssembly plugins via wasmtime"

[dependencies]
tropel-core.workspace = true
tropel-ext.workspace = true
# wasmtime 47 (latest). We build only what the plugin runtime needs:
# cranelift (JIT + precompile_module), wat (WAT text in tests),
# pooling-allocator (PoolingAllocationConfig), runtime + std (core
# engine/module/instance APIs). The heavy optional machinery
# (component-model, gc, profiling, coredump, async, cache) stays off —
# smaller binaries and faster builds.
#
# Note: wasmtime <47 aborted the whole process on Windows when a trap
# fired (fuel/epoch) — the old longjmp-based trap unwinding tripped MSVC's
# /GS stack-cookie check (STATUS_STACK_BUFFER_OVERRUN). wasmtime 47
# rewrote trap unwinding with a dedicated unwinder crate, which traps
# cleanly on Windows (verified by the infinite-loop test).
wasmtime = { version = "47.0.2", default-features = false, features = [
    "anyhow",
    "cranelift",
    "wat",
    "pooling-allocator",
    "runtime",
    "std",
] }
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true
