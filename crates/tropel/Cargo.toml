[package]
name = "tropel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tropel"
path = "src/main.rs"

[features]
default = ["alloc-mimalloc"]
# Use mimalloc as the global allocator (default, well-tested)
alloc-mimalloc = ["dep:mimalloc"]
# Use tikv-jemallocator as the global allocator (better for large RSS)
alloc-jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
tropel-core.workspace = true
tropel-engine.workspace = true
tropel-ext.workspace = true
tropel-metrics.workspace = true
# Reference extension: links its inventory-registered outputs (e.g.
# "prometheus") into the binary so ExtensionRegistry can find them.
tropel-x-prometheus.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
csv = "1.4.0"
