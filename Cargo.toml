[workspace]
resolver = "2"
members = [
    "crates/tropel",
    "crates/tropel-es",
    "crates/tropel-engine",
    "crates/tropel-core",
    "crates/tropel-collection",
    "crates/tropel-variables",
    "crates/tropel-js",
    "crates/tropel-pm",
    "crates/tropel-native",
    "crates/tropel-http",
    "crates/tropel-executor",
    "crates/tropel-metrics",
    "crates/tropel-report",
    "crates/tropel-sdk",
    "crates/tropel-ext",
    "crates/tropel-build",
    "crates/inputs/tropel-input-postman",
    "crates/inputs/tropel-input-k6",
    "crates/inputs/tropel-input-har",
    "crates/inputs/tropel-input-openapi",
    "crates/inputs/tropel-input-subprocess",
    "crates/extensions/tropel-x-grpc",
    "crates/extensions/tropel-x-websocket",
    "crates/extensions/tropel-x-prometheus",
    "crates/tropel-wasm",
    "crates/tropel-distributed",
    "crates/tropel-bench",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prasadthx/tropel"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }

# JS engine
rquickjs = { version = "0.12.2", features = ["full-async"] }

# HTTP client
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "cookies", "gzip", "brotli", "http2", "json", "stream", "query", "form"] }
tower = { version = "0.5.3", default-features = false }

# Serialization
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"

# Fast JSON parsing (≈2-4× faster than serde_json for response bodies)
simd-json = { version = "0.17.3", features = ["serde_impl"] }

# Metrics
hdrhistogram = "7.6.0"

# CLI
clap = { version = "4.6.4", features = ["derive"] }

# Extension registration
inventory = "0.3.24"

# Error handling
thiserror = "2.0.19"
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Hashing / crypto
sha2 = "0.11.0"
sha1 = "0.11.0"
sha3 = "0.12.0"
md-5 = "0.11.0"
ripemd = "0.2.0"
hmac = "0.13.0"
aes = "0.9.2"
aes-gcm = "0.11.0"
cbc = "0.2.1"

# Encoding
base64 = "0.23.0"
hex = "0.4.3"
percent-encoding = "2.3.2"
serde_urlencoded = "0.7"
# Request-body compression (k6 params.compression: gzip/deflate)
flate2 = "1.1.9"

# UUID / random
uuid = { version = "1.24.0", features = ["v4"] }
rand = "0.10.2"

# Regex
regex = "1.13.1"

# Async helpers
futures = "0.3.33"
async-trait = "0.1.91"

# Date/time
chrono = { version = "0.4.45", features = ["serde"] }

# Allocator (default: mimalloc; feature-gate tikv-jemallocator)
mimalloc = { version = "0.1.52", default-features = false }
tikv-jemallocator = { version = "0.7.0", default-features = false }

# Testing
wiremock = "0.6.5"
insta = "1.48.0"
# WIT parsing — used by tropel-sdk's unit test to prove wit/adapter.wit
# stays valid (regression guard for the broken-WIT history). Version
# chosen from the local registry cache; the WIT uses standard constructs
# that any current wit-parser accepts.
wit-parser = "0.255.0"

# Snappy compression (Prometheus remote-write)
snap = "1.1.2"

# Fast hash maps for tag sets
rustc-hash = "2.1.3"

# gRPC extension (tropel-x-grpc): runtime proto loading + unary/streaming
protox = "0.9.1"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "tls-native-roots"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
# HTTP/URI types (tonic's unary/server_streaming take http::uri::PathAndQuery)
http = "1.5.0"
bytes = "1.10.1"

# WebSocket extension (tropel-x-websocket): tokio async client
# (rustls-tls-webpki-roots enables wss:// without system cert deps)
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.33"

# IndexMap for preserving insertion order
indexmap = { version = "2.14.0", features = ["serde"] }

# Temp directory for tropel-build
tempfile = "3.27.0"

# URL parsing
url = { version = "2.5.8", features = ["serde"] }

# TypeScript transpilation (oxc toolchain — real parser, not regex).
# NOTE: pinned to 0.128 — the newest oxc whose source compiles on rustc 1.94.
# 0.131+ uses `&& let` guards (stabilized in rustc 1.95); 0.140+ declares
# MSRV 1.95 outright. Verified by scanning each release's typescript/class.rs.
oxc_allocator = "0.128.0"
oxc_parser = "0.128.0"
oxc_span = "0.128.0"
oxc_ast = "0.128.0"
oxc_semantic = "0.128.0"
oxc_transformer = "0.128.0"
oxc_codegen = "0.128.0"
oxc_diagnostics = "0.128.0"
# Pin transitive MSRV-safe versions (browserslist 3.0.10+/sourcemap 8.1+ need rustc 1.95)
oxc-browserslist = "=3.0.9"
oxc_sourcemap = "=8.0.2"

# Lazy initialization
once_cell = "1.21.4"

# MIME types
mime = "0.3.17"
mime_guess = "2.0.5"

# CSV parsing for data files
csv = "1.4.0"



# ── Internal workspace crate paths ────────────────────
tropel-core = { path = "crates/tropel-core" }
tropel-collection = { path = "crates/tropel-collection" }
tropel-variables = { path = "crates/tropel-variables" }
tropel-js = { path = "crates/tropel-js" }
tropel-native = { path = "crates/tropel-native" }
tropel-pm = { path = "crates/tropel-pm" }
tropel-http = { path = "crates/tropel-http" }
tropel-executor = { path = "crates/tropel-executor" }
tropel-metrics = { path = "crates/tropel-metrics" }
tropel-report = { path = "crates/tropel-report" }
tropel-ext = { path = "crates/tropel-ext" }
tropel-sdk = { path = "crates/tropel-sdk" }
tropel-engine = { path = "crates/tropel-engine" }
tropel-build = { path = "crates/tropel-build" }
tropel-input-postman = { path = "crates/inputs/tropel-input-postman" }
tropel-input-k6 = { path = "crates/inputs/tropel-input-k6" }
tropel-input-har = { path = "crates/inputs/tropel-input-har" }
tropel-input-openapi = { path = "crates/inputs/tropel-input-openapi" }
tropel-input-subprocess = { path = "crates/inputs/tropel-input-subprocess" }
tropel-x-grpc = { path = "crates/extensions/tropel-x-grpc" }
tropel-x-websocket = { path = "crates/extensions/tropel-x-websocket" }
tropel-x-prometheus = { path = "crates/extensions/tropel-x-prometheus" }
tropel-es = { path = "crates/tropel-es" }
tropel-wasm = { path = "crates/tropel-wasm" }
